name: realesrgan
channels:
  - pytorch
  - nvidia
  - defaults
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytorch-cuda=11.8
  - pip:
    - torch==1.13.1+cu118 --extra-index-url https://download.pytorch.org/whl/cu118
    - torchvision==0.14.1+cu118 --extra-index-url https://download.pytorch.org/whl/cu118
    - numpy<2
    - opencv-python==4.8.0.74
    - Pillow
    - basicsr>=1.4.2
    - facexlib>=0.2.5
    - gfpgan>=1.3.5
    - tqdm
    - addict
    - future
    - lmdb
    - pyyaml
    - requests
    - scikit-image
    - scipy
    - tb-nightly
    - yapf
    - filterpy
    - numba
