services:
  # PostgreSQL Database (로컬 개발용)
  postgres:
    image: postgres:16-alpine
    container_name: kolon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kolon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-kolon_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kolon_user}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database (로컬 개발용)
  qdrant:
    image: qdrant/qdrant:v1.16.0
    container_name: kolon-qdrant
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC (optional)
    networks:
      - app-network
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Session Management, 로컬 개발용)
  redis:
    image: redis:7-alpine
    container_name: kolon-redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server \
            --notify-keyspace-events Ex \
            --maxmemory 512mb \
            --maxmemory-policy allkeys-lru \
            --requirepass "$$REDIS_PASSWORD" \
            --appendonly yes \
            --appendfsync everysec
        else
          exec redis-server \
            --notify-keyspace-events Ex \
            --maxmemory 512mb \
            --maxmemory-policy allkeys-lru \
            --appendonly yes \
            --appendfsync everysec
        fi
    env_file:
      - ./.env
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: >
        sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping;
        else
          redis-cli ping;
        fi'
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend (로컬 개발용)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kolon-backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TEST_MODE: ${TEST_MODE:-true}
      # Timezone
      TZ: Asia/Seoul

      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-kolon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-kolon_db}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kolon_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-kolon_db}

      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-kolon_used_cars}
      QDRANT_URL: ${QDRANT_URL:-} # Optional: for Qdrant Cloud
      QDRANT_API_KEY: ${QDRANT_API_KEY:-} # Optional: for Qdrant Cloud

      # Redis (세션 관리)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # REDIS_PASSWORD는 ./.env에서 로드 (선택)

      # OpenAI (loaded from .env file via env_file)
      # OPENAI_API_KEY is loaded from ./.env file
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}

      # Application
      USE_AUTOENCODER: ${USE_AUTOENCODER:-true}
      CF3_PLY_PATH: ${CF3_PLY_PATH:-/backend/source/cf3_demo/cf3.ply}
      AUTOENCODER_PATH: ${AUTOENCODER_PATH:-/backend/source/cf3_demo/autoencoder.pth}

      # Logging
      LOG_DIR: /backend/logs
      SESSION_LOG_DIR: /backend/logs/session_logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # R2 Storage (if used)
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
    volumes:
      # Prompts (로컬에서 프롬프트 수정 가능)
      - ./backend/prompts:/backend/prompts:rw
      # Source files (PLY, models, etc.) - 모든 3D 모델과 정적 파일이 여기에 있음
      - ./source:/backend/source:ro
      # 3D Simulator pipeline code
      - ./3d_simulator:/app/3d_simulator:rw
      # Docker socket - 파이프라인 스크립트가 docker compose를 실행할 수 있도록
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Application logs
      - ./data/logs:/backend/logs
    working_dir: /backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (옵션: 로컬에서 리버스 프록시/HTTPS 테스트용)
  nginx:
    image: nginx:alpine
    container_name: kolon-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx configuration
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL certificates (for HTTPS, 필요 시)
      - ./nginx/certs:/etc/nginx/certs:ro
      # Source files (3D models, PLY files, etc.) - Backend와 동일한 source 디렉토리 사용
      - ./source:/var/www/static/source:ro
      # Logs
      - ./nginx/logs:/var/log/nginx
    networks:
      - app-network
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Docker에서 개발 모드로 띄우고 싶을 때 사용, 기본은 주석 처리)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: kolon-frontend
  #   restart: unless-stopped
  #   environment:
  #     - NEXT_PUBLIC_API_URL=http://localhost/api
  #   volumes:
  #     - ./frontend:/frontend
  #   working_dir: /frontend
  #   command: yarn run dev
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - app-network
  #   depends_on:
  #     - backend
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kolon-cloudflared
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - TUNNEL_METRICS=0.0.0.0:60123
    command: tunnel --no-autoupdate run
    volumes:
      # 토큰이 없을 때 인증서 파일 사용 (폴백)
      - ~/.cloudflared:/etc/cloudflared:ro
    # 호스트 네트워크 사용 (localhost:80에 접근하기 위해 필수)
    # network_mode: "host"
    networks:
      - app-network
    depends_on:
      - nginx
    healthcheck:
      test: [ "CMD", "cloudflared", "tunnel", "ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  # The auto-healer watches other containers and restarts unhealthy ones
  autoheal:
    image: willfarrell/autoheal:latest
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: "autoheal"
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
      WEBHOOK_URL: ${WEBHOOK_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
networks:
  app-network:
    driver: bridge
    name: kolon-app-network

