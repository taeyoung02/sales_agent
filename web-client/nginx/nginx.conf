# Nginx configuration for DGX Spark server
# Place this file at /srv/nginx/nginx.conf on DGX Spark

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    # IMPORTANT: keepalive_timeout MUST be shorter than session TTL (30min = 1800s)
    # Nginx cannot detect session expiry, so Redis TTL is the only reliable method
    # Current: 65s << 1800s (session TTL) ✅
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;  # For file uploads
    
    # 타임아웃 설정 (큰 PLY 파일 다운로드를 위해 충분히 긴 시간 설정)
    send_timeout 600s;        # 클라이언트로 데이터 전송 타임아웃 (10분)

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    # PLY 파일은 바이너리이므로 gzip 압축 효과가 제한적이지만, 텍스트 기반 PLY는 압축 가능
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml
               application/octet-stream;  # PLY 파일 타입 추가

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # Upstream backend
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # Frontend는 Vercel 배포 → Nginx는 API·정적·헬스만 처리, / 는 404

    # HTTP server - redirect to HTTPS (uncomment when SSL is configured)
    server {
        listen 80;
        server_name _;  # Replace with your domain name

        # For Let's Encrypt certificate validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP to HTTPS (uncomment when SSL is ready)
        # return 301 https://$server_name$request_uri;

        # Static files (served by Nginx)
        # Source files (3D models, PLY, etc.) are mounted at /var/www/static/source
        # IMPORTANT: This must come BEFORE /static/ and / location blocks
        location /static/source/ {
            alias /var/www/static/source/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            
            # CORS headers (FastAPI와 동일하게 설정)
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
            
            # Range 요청 지원 (큰 파일 다운로드 최적화)
            # 브라우저가 자동으로 청크 단위로 다운로드하여 더 빠름
            # nginx는 기본적으로 Range 요청을 지원하지만 명시적으로 설정
            # Accept-Ranges 헤더를 항상 포함하여 브라우저가 Range 요청을 사용할 수 있음을 알림
            add_header Accept-Ranges "bytes" always;
            
            # OPTIONS 요청 처리 (preflight)
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type "text/plain; charset=utf-8";
                add_header Content-Length 0;
                return 204;
            }
            
            # 큰 파일 전송을 위한 최적화
            # 타임아웃은 http 블록에서 send_timeout으로 이미 설정됨
            # sendfile, tcp_nopush는 http 블록에서 이미 설정됨
            
            # Debug logging
            access_log /var/log/nginx/static_source.log;
            error_log /var/log/nginx/static_source_error.log;
            # Ensure files are readable
            try_files $uri =404;
        }
        
        # Other static files (if needed in the future)
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint (for Docker healthcheck)
        location /health {
            access_log off;
            proxy_pass http://backend/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API endpoints - streaming (SSE) 지원
        location /api/chat/stream {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            
            # Streaming을 위한 설정
            proxy_buffering off;  # 버퍼링 비활성화 (중요!)
            proxy_cache off;  # 캐시 비활성화
            proxy_read_timeout 300s;  # 긴 타임아웃
            proxy_connect_timeout 75s;
            
            # SSE를 위한 헤더
            add_header Cache-Control 'no-cache' always;
            add_header X-Accel-Buffering 'no' always;
        }
        
        # API endpoints - data loading (큰 데이터 로딩을 위한 긴 타임아웃)
        location /api/data/load {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            # 큰 데이터 로딩을 위한 긴 타임아웃 (15분)
            proxy_read_timeout 900s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 900s;
            
            # IMPORTANT: API routes must NOT be cached
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
        
        # API endpoints (일반)
        location /api/ {
            proxy_pass http://backend;
            # REQUIRED: proxy_set_header Host is critical for session cookie handling
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            
            # IMPORTANT: API routes must NOT be cached (session data is dynamic)
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Frontend는 Vercel에서 제공. API 도메인 루트는 404
        location / {
            default_type application/json;
            return 404 '{"message":"API server. Frontend is on Vercel."}';
        }
    }

    # HTTPS server (uncomment and configure when SSL certificates are ready)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;  # Replace with your domain
    #
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # API endpoints with rate limiting
    #     location /api/ {
    #         limit_req zone=api_limit burst=20 nodelay;
    #         proxy_pass http://backend;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_redirect off;
    #         proxy_read_timeout 300s;
    #         proxy_connect_timeout 75s;
    #     }
    #
    #     # Static files
    #     location /static/ {
    #         alias /var/www/static/;
    #         expires 30d;
    #         add_header Cache-Control "public, immutable";
    #     }
    #
    #     # Frontend (Next.js standalone - Node.js server)
    #     location / {
    #         proxy_pass http://frontend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection 'upgrade';
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_cache_bypass $http_upgrade;
    #         proxy_redirect off;
    #         proxy_read_timeout 300s;
    #         proxy_connect_timeout 75s;
    #     }
    #
    #     # Health check
    #     location /health {
    #         access_log off;
    #         proxy_pass http://backend/api/health;
    #     }
    # }

    # Include additional server configurations
    include /etc/nginx/conf.d/*.conf;
}
